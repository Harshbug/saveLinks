services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - linkvault_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - linkvault_network

  #need to add one worker service 
  worker:
    build: ./backend
    command: node src/worker.js
    env_file: ./backend/.env
    environment:
      REDIS_HOST=redis
    depends_on:[mongo,redis]

volumes:
  mongo_data:

networks:
  linkvault_network:
    driver: bridge